<style>

body { margin: 0px; padding: 24px 12px; background: rgb(237, 241, 246); }

@media (max-width: 760px) {

}

#mellan-app { font: 14px / 1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: rgb(23, 35, 59); max-width: 1100px; margin: auto; border: 1px solid rgb(219, 227, 236); border-radius: 16px; overflow: hidden; background: rgb(246, 248, 251); box-shadow: rgba(18, 28, 48, 0.08) 0px 2px 14px; }

#mellan-app * { box-sizing: border-box; }

#mellan-app button, #mellan-app input, #mellan-app textarea, #mellan-app select { font: inherit; }

#mellan-app button { cursor: pointer; }

#mellan-app button:disabled { opacity: 0.5; cursor: not-allowed; }

#mellan-app .layout { display: grid; grid-template-columns: 215px minmax(0px, 1fr); min-height: 640px; }

#mellan-app .aside { background: rgb(23, 35, 58); color: rgb(237, 243, 250); padding: 23px 14px; display: flex; flex-direction: column; gap: 22px; }

#mellan-app .brand { display: flex; align-items: center; gap: 11px; padding: 0px 7px; }

#mellan-app .logo { background: rgb(137, 214, 177); color: rgb(17, 53, 45); border-radius: 10px; width: 37px; height: 37px; display: grid; place-items: center; font-size: 27px; font-weight: 700; }

#mellan-app .brand strong { font-size: 24px; letter-spacing: -1px; }

#mellan-app .asidehead { display: flex; align-items: center; justify-content: space-between; padding: 0px 8px; font-size: 10px; font-weight: 750; letter-spacing: 1.4px; color: rgb(154, 174, 197); }

#mellan-app .nav { display: flex; flex-direction: column; gap: 6px; }

#mellan-app .nav button { border: 0px; text-align: left; background: transparent; color: rgb(191, 208, 230); border-radius: 9px; padding: 10px 12px; width: 100%; }

#mellan-app .nav button.on { background: rgb(48, 65, 94); color: white; }

#mellan-app .nav button b { display: block; overflow-wrap: anywhere; font-size: 13px; }

#mellan-app .nav button span { color: rgb(159, 178, 202); font-size: 11px; }

#mellan-app .asidefoot { margin-top: auto; padding: 8px; color: rgb(162, 180, 202); font-size: 11px; }

#mellan-app .main { padding: 25px; min-width: 0px; }

#mellan-app .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }

#mellan-app .eyebrow { font-weight: 800; letter-spacing: 1.5px; font-size: 10px; color: rgb(117, 131, 154); }

#mellan-app h2 { font-size: 27px; line-height: 1.2; letter-spacing: -0.7px; margin: 4px 0px 7px; }

#mellan-app h3 { font-size: 15px; margin: 0px; color: rgb(26, 42, 69); }

#mellan-app p { margin: 0px; }

#mellan-app .sub { color: rgb(112, 128, 151); font-size: 12px; }

#mellan-app .actions { display: flex; flex-wrap: wrap; gap: 7px; }

#mellan-app .btn { padding: 9px 13px; border: 1px solid rgb(215, 224, 235); border-radius: 8px; background: white; color: rgb(36, 55, 83); font-size: 12px; font-weight: 700; }

#mellan-app .btn.primary { background: rgb(44, 142, 117); border-color: rgb(44, 142, 117); color: white; }

#mellan-app .btn.danger { color: rgb(182, 77, 82); border-color: rgb(240, 203, 208); }

#mellan-app .btn.tiny { padding: 5px 8px; }

#mellan-app .btn.quiet { background: transparent; }

#mellan-app .btn:hover { filter: brightness(0.96); }

#mellan-app .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 12px; margin-bottom: 16px; }

#mellan-app .stat, #mellan-app .panel { background: white; border: 1px solid rgb(225, 232, 240); border-radius: 12px; }

#mellan-app .stat { padding: 16px; }

#mellan-app .stat .label { color: rgb(113, 129, 153); font-size: 11px; font-weight: 650; }

#mellan-app .stat strong { display: block; font-size: 21px; letter-spacing: -0.5px; margin-top: 8px; overflow-wrap: anywhere; }

#mellan-app .stat small { color: rgb(154, 171, 188); font-size: 10px; }

#mellan-app .columns { display: grid; grid-template-columns: minmax(0px, 1.3fr) minmax(240px, 1fr); gap: 14px; }

#mellan-app .panel { padding: 17px; margin-bottom: 14px; min-width: 0px; }

#mellan-app .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }

#mellan-app .item { display: flex; align-items: center; gap: 10px; border-top: 1px solid rgb(239, 242, 246); padding: 11px 0px; min-width: 0px; }

#mellan-app .item:first-of-type { border-top: 0px; }

#mellan-app .round { background: rgb(225, 242, 237); color: rgb(52, 121, 99); border-radius: 10px; min-width: 33px; height: 33px; display: grid; place-items: center; font-weight: 750; }

#mellan-app .item .desc { flex: 1 1 0%; min-width: 0px; }

#mellan-app .item .desc span { display: block; color: rgb(130, 144, 163); font-size: 11px; }

#mellan-app .amount { font-size: 12px; font-weight: 800; white-space: nowrap; }

#mellan-app .empty { color: rgb(145, 160, 178); padding: 19px 4px; text-align: center; font-size: 12px; }

#mellan-app .person { display: flex; align-items: center; gap: 9px; border-top: 1px solid rgb(239, 242, 246); padding: 9px 0px; }

#mellan-app .person .who { flex: 1 1 0%; min-width: 0px; }

#mellan-app .person .who small { font-size: 10px; color: rgb(135, 149, 166); }

#mellan-app .balance { font-weight: 750; font-size: 12px; white-space: nowrap; }

#mellan-app .plus { color: rgb(33, 133, 106); }

#mellan-app .minus { color: rgb(188, 98, 97); }

#mellan-app .settle { padding: 10px 0px; border-top: 1px solid rgb(237, 241, 245); display: flex; justify-content: space-between; align-items: center; gap: 9px; }

#mellan-app input[type="checkbox"] { accent-color: rgb(44, 142, 117); }

#mellan-app .checkbox { display: flex; align-items: center; gap: 6px; }

#mellan-app .modalbg { position: fixed; inset: 0px; background: rgba(9, 24, 45, 0.61); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 12px; }

#mellan-app .modal { background: rgb(255, 255, 255); border-radius: 14px; max-width: 480px; width: 100%; max-height: 90vh; overflow: auto; padding: 22px; box-shadow: rgba(19, 32, 50, 0.333) 0px 18px 70px; }

#mellan-app .modal h3 { font-size: 20px; margin-bottom: 6px; }

#mellan-app .modal .checkgrid label { font-size: 12px; display: flex; gap: 5px; align-items: center; }

#mellan-app .modalfooter { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

#mellan-app textarea { resize: vertical; min-height: 85px; font-size: 12px; }

#mellan-app .notice { font-size: 11px; color: rgb(115, 131, 154); margin: 12px 0px; }

#mellan-app .error { color: rgb(181, 70, 78); font-size: 12px; font-weight: 600; min-height: 16px; }

#mellan-app .toast { margin-bottom: 12px; padding: 9px 12px; border-radius: 8px; background: rgb(227, 242, 236); color: rgb(36, 111, 93); font-size: 12px; }

#mellan-app .danger-text { color: rgb(182, 77, 82); }

#mellan-app .currency { width: 100px !important; }

#mellan-app .sharedhint { font-size: 11px; color: rgb(113, 131, 154); margin-top: 12px; }

@media (max-width: 760px) {
  #mellan-app .layout { grid-template-columns: 1fr; }
  #mellan-app .aside { padding: 12px; gap: 12px; }
  #mellan-app .asidefoot { display: none; }
  #mellan-app .asidehead { padding: 0px 5px; }
  #mellan-app .nav { flex-direction: row; overflow-x: auto; }
  #mellan-app .nav button { min-width: 120px; max-width: 180px; }

  #mellan-app .stat strong { font-size: 16px; }

@media (max-width: 420px) {

<style data-theme-css="bold">
body { background: rgb(191, 206, 197); padding: 28px 20px; }

#mellan-app .asidehead { color: rgb(210, 212, 205); font-size: 11px; letter-spacing: 1.2px; }

#mellan-app .people-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 280ms, opacity 200ms; }

#mellan-app .people-inner { min-height: 0px; overflow: hidden; }

#mellan-app .people-grid { padding-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); column-gap: 28px; }

#mellan-app .participants-panel.is-collapsed .people-body { grid-template-rows: 0fr; opacity: 0; }

#mellan-app .participants-panel .person { min-width: 0px; }

@media (max-width: 760px) {
  #mellan-app .people-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  #mellan-app .people-body { transition: none; }
}

#mellan-app button.btn.people-toggle { display: inline-grid; place-items: center; padding: 0px; width: 48px; height: 48px; flex-shrink: 0; }

#mellan-app .people-toggle svg { display: block; pointer-events: none; }

#mellan-app .grid3 { grid-template-columns: minmax(0px, 1fr) !important; }

#mellan-app .grid3 > .stat { grid-column: 1 / -1; }

#mellan-app .fold-panel > .ph { margin-bottom: 0px; align-items: center; flex-wrap: nowrap; }

#mellan-app .fold-panel.is-collapsed .people-body { grid-template-rows: 0fr; opacity: 0; }

#mellan-app .fold-content { padding-top: 16px; }

#mellan-app .top .actions .btn { background: var(--action-color,#a2e4ee) !important; color: rgb(32, 35, 34) !important; border-color: var(--action-color,#a2e4ee) !important; }

#mellan-app .nav { padding-bottom: calc(var(--nav-base-bottom,0px) + 12px) !important; margin-bottom: -12px; }

#mellan-app .participants-panel .person { display: grid; grid-template-columns: minmax(0px, 1fr) 48px; gap: 7px 12px; align-items: center; }

#mellan-app .participants-panel .person .who { grid-area: 1 / 1; min-width: 0px !important; }

#mellan-app .participants-panel .person .who b { font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }

#mellan-app .participants-panel .person .balance { grid-area: 2 / 1; white-space: normal; overflow-wrap: anywhere; }

#mellan-app .participants-panel .person > .btn { grid-area: 1 / 2 / 3; }

#mellan-app .item { display: grid; grid-template-columns: minmax(0px, 1fr) auto; gap: 8px 12px; }

#mellan-app .item .desc { grid-area: 1 / 1 / auto / -1; }

#mellan-app .item .desc b { font-size: 18px; line-height: 1.4; }

#mellan-app .item .amount { grid-area: 2 / 1; white-space: normal; overflow-wrap: anywhere; }

#mellan-app .item > .btn { grid-area: 2 / 2; }

:root { view-transition-name: none; }

::view-transition-group(*) { animation-duration: 220ms; animation-timing-function: cubic-bezier(0.2, 0.75, 0.25, 1); }

::view-transition-old(*) { animation: 180ms ease-in 0s 1 normal both running row-out; }

::view-transition-new(*) { animation: 220ms ease-out 0s 1 normal both running row-in; }

@keyframes row-out { 
  100% { opacity: 0; transform: translateY(-7px) scale(0.985); }
}

@keyframes row-in { 
  0% { opacity: 0; transform: translateY(8px) scale(0.99); }
}

#mellan-app .people-error { margin: 12px 0px 0px; padding: 13px 16px; border-radius: 16px; background: rgb(255, 120, 105); color: rgb(37, 35, 34); font-size: 15px; line-height: 1.45; font-weight: 700; border: 1px solid rgb(232, 108, 95); }

#mellan-app .people-error[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: auto ease 0s 1 normal none running none !important; }
  #mellan-app .people-error { transition: none; }
}

#mellan-app .people-grid { grid-template-columns: minmax(0px, 1fr) !important; }

#mellan-app .participants-panel .person { width: 100%; box-sizing: border-box; }
#mellan-app .modalfooter .btn.danger { margin-right: auto; }
#mellan-app [data-split] { margin-top: 6px; }
#mellan-app .splithint { margin: 4px 0 6px; }
#mellan-app .splitrows { display: grid; gap: 4px; }
#mellan-app .splitrow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 12px; align-items: center; min-height: 52px; font-weight: 400; }
#mellan-app .splitrow .nm { min-width: 0; }
#mellan-app .splitrow .nm b { display: block; font-size: 16px; overflow-wrap: anywhere; }
#mellan-app .splitrow .nm small { display: block; font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; min-height: 1em; }
#mellan-app .splitin { display: flex; align-items: center; gap: 6px; }
#mellan-app .splitin input { text-align: right; font-variant-numeric: tabular-nums; }
#mellan-app .splitin span { font-size: 13px; opacity: .8; min-width: 2.2em; }
#mellan-app .splitsum { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; background: rgba(255, 120, 105, .18); font-variant-numeric: tabular-nums; }
#mellan-app .splitsum.is-ok { background: rgba(137, 214, 177, .22); }
#mellan-app .splitsum:empty { display: none; }

<div class="aside-brand"><div class="brand"><div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M5.5 12h13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"></path><circle cx="12" cy="6.5" r="1.95"></circle><circle cx="12" cy="17.5" r="1.95"></circle></svg></div><strong>Split</strong></div>

</div>
<div><div class="asidehead"><span id="lbl-mylists">MY LISTS</span> <button class="btn tiny" data-action="new" aria-label="Create a new list">＋</button></div><nav class="nav" id="m-nav"></nav></div>

</aside><main class="main"><div id="m-content"></div></main></div><div id="m-overlay"></div>
</div>
<script>
(() => {
  'use strict';
  const KEY = 'split-data-v1';
  const CURRENCIES = ['SEK', 'EUR', 'USD', 'NOK', 'DKK'];
  const THEMES = ['mobile', 'paper', 'buttons', 'bold', 'dusk'];

  const T = {
    sv: {
      myLists: 'MINA LISTOR', newListAria: 'Skapa en ny lista', participantsN: n => `${n} ${n === 1 ? 'deltagare' : 'deltagare'}`,
      noAccount: 'Utan konto eller databas.', dataLocal: 'Uppgifterna ligger på din enhet när webbläsaren tillåter det.',
      settings: 'Inställningar', language: 'Språk', theme: 'Tema',
      themeNames: { mobile: 'Marin', paper: 'Kobolt', buttons: 'Pastell', bold: 'Korall', dusk: 'Skymning' },
      rename: 'Byt namn', backup: 'Säkerhetskopia', share: 'Dela',
      total: 'Totala utgifter', inclTip: 'inklusive dricks',
      participants: 'Deltagare', add: '＋ Lägg till', collapseP: 'Fäll ihop deltagare', expandP: 'Visa deltagare',
      startAdding: 'Börja med att lägga till deltagare.',
      expenses: 'Utgifter', newExpense: '＋ Ny utgift', noExpenses: 'Inga utgifter än. Lägg till din första utgift.',
      settleUp: 'Gör upp', settled: 'Alla är kvitt, eller så har inga utgifter lagts till.',
      tip: 'Dricks', show: 'Visa', hide: 'Dölj', includeTip: 'Lägg till dricks', type: 'Typ', percent: 'Procent (%)', fixed: 'Fast belopp',
      value: 'Värde', whoPaysTip: 'Vem betalar dricksen?', updateTip: 'Uppdatera dricks', tipIs: 'Dricks',
      listSettings: 'Listinställningar', currency: 'Valuta', deleteList: 'Radera lista',
      savedHint: 'Listan sparas i din webbläsare. Gör en säkerhetskopia för att behålla en kopia.',
      paid: 'Betalat', shareOf: 'Andel', paidBy: 'Betalt av', splitBetween: 'delas mellan', everyone: 'alla',
      pays: (a, b) => `${a} betalar ${b}`,
      cancel: 'Avbryt', save: 'Spara', del: 'Radera', name: 'Namn', description: 'Beskrivning', amount: 'Belopp',
      whoPaid: 'Vem betalade?', forWhom: 'Vilka ska dela?', edit: 'Ändra', remove: 'Ta bort',
      howSplit: 'Hur ska utgiften delas?',
      modes: { equal: 'Lika delar', percent: 'I procent', shares: 'I andelar', exact: 'Exakta belopp' },
      modeShort: { percent: 'procent', shares: 'andelar', exact: 'exakt' },
      modeHint: { percent: 'Ange hur många procent var och en står för.', shares: 'Ange antal andelar. Den som har 2 betalar dubbelt så mycket som den som har 1.', exact: 'Ange exakt hur mycket var och en ska betala.' },
      sumPercent: (a, r) => `${a} % fördelat · ${r} % kvar`, sumPercentOver: (a, r) => `${a} % fördelat · ${r} % för mycket`,
      sumShares: n => `${n} andelar totalt`,
      sumExact: (a, r) => `${a} fördelat · ${r} kvar`, sumExactOver: (a, r) => `${a} fördelat · ${r} för mycket`,
      needPercent: 'Procentsatserna måste bli 100 % tillsammans.', needShares: 'Ge minst en person en andel.',
      needExact: 'Beloppen måste bli lika mycket som hela utgiften.', badNumber: 'Använd bara siffror, noll eller mer.',
      create: 'Lägg till utgift',
      addPerson: 'Lägg till deltagare', newExpenseTitle: 'Ny utgift', editExpense: 'Ändra utgift',
      renameTitle: 'Byt namn på listan', listName: 'Listans namn',
      confirmDelete: n => `Vill du radera "${n}"? Det går inte att ångra.`,
      cannotRemove: n => `${n} ingår i en utgift och kan inte tas bort. Ändra eller radera utgiften först.`,
      duplicate: n => `Det finns redan en deltagare som heter ${n}.`,
      needName: 'Skriv ett namn.', needAmount: 'Ange ett belopp större än noll.', needDesc: 'Skriv en beskrivning.',
      needAmong: 'Välj minst en person.',
      defaultList: 'Våra utgifter', newListName: n => `Ny lista ${n}`,
      copy: 'Kopiera', copied: 'Kopierat!', download: 'Ladda ner', restore: 'Återställ',
      backupIntro: 'Här är alla dina listor som text. Spara den någonstans, eller klistra in en tidigare kopia och tryck på Återställ.',
      restoreBad: 'Texten är inte en giltig säkerhetskopia.', restored: n => `${n} listor återställda.`,
      shareTitle: 'Dela listan', shareIntro: 'Skicka länken. Mottagaren får en egen kopia av listan i sin webbläsare.',
      importTitle: 'Importera delad lista', importQ: n => `Vill du lägga till listan "${n}" på den här enheten?`,
      importBtn: 'Lägg till', imported: 'Listan har lagts till.', importBad: 'Länken kunde inte läsas.',
      close: 'Stäng'
    },
    en: {
      myLists: 'MY LISTS', newListAria: 'Create a new list', participantsN: n => `${n} participant${n === 1 ? '' : 's'}`,
      noAccount: 'No account or database.', dataLocal: 'Your data stays on this device when your browser allows it.',
      settings: 'Settings', language: 'Language', theme: 'Theme',
      themeNames: { mobile: 'Navy', paper: 'Cobalt', buttons: 'Pastel', bold: 'Coral', dusk: 'Dusk' },
      rename: 'Rename', backup: 'Backup', share: 'Share',
      total: 'Total expenses', inclTip: 'including tip',
      participants: 'Participants', add: '＋ Add', collapseP: 'Collapse participants', expandP: 'Show participants',
      startAdding: 'Start by adding participants.',
      expenses: 'Expenses', newExpense: '＋ New expense', noExpenses: 'No expenses yet. Add your first expense.',
      settleUp: 'Settle up', settled: 'Everyone is settled up, or no expenses have been added.',
      tip: 'Tip', show: 'Show', hide: 'Hide', includeTip: 'Include a tip', type: 'Type', percent: 'Percentage (%)', fixed: 'Fixed amount',
      value: 'Value', whoPaysTip: 'Who pays the tip?', updateTip: 'Update tip', tipIs: 'Tip',
      listSettings: 'List settings', currency: 'Currency', deleteList: 'Delete list',
      savedHint: 'This list is saved in your browser. Use a backup to keep a copy.',
      paid: 'Paid', shareOf: 'Share', paidBy: 'Paid by', splitBetween: 'split between', everyone: 'everyone',
      pays: (a, b) => `${a} pays ${b}`,
      cancel: 'Cancel', save: 'Save', del: 'Delete', name: 'Name', description: 'Description', amount: 'Amount',
      whoPaid: 'Who paid?', forWhom: 'Split between', edit: 'Edit', remove: 'Remove',
      howSplit: 'How should it be split?',
      modes: { equal: 'Equal parts', percent: 'By percent', shares: 'By shares', exact: 'Exact amounts' },
      modeShort: { percent: 'percent', shares: 'shares', exact: 'exact' },
      modeHint: { percent: 'Enter the percentage each person covers.', shares: 'Enter a number of shares. Someone with 2 pays twice as much as someone with 1.', exact: 'Enter exactly how much each person pays.' },
      sumPercent: (a, r) => `${a} % assigned · ${r} % left`, sumPercentOver: (a, r) => `${a} % assigned · ${r} % too much`,
      sumShares: n => `${n} shares in total`,
      sumExact: (a, r) => `${a} assigned · ${r} left`, sumExactOver: (a, r) => `${a} assigned · ${r} too much`,
      needPercent: 'The percentages must add up to 100 %.', needShares: 'Give at least one person a share.',
      needExact: 'The amounts must add up to the whole expense.', badNumber: 'Use numbers only, zero or more.',
      create: 'Add expense',
      addPerson: 'Add participant', newExpenseTitle: 'New expense', editExpense: 'Edit expense',
      renameTitle: 'Rename list', listName: 'List name',
      confirmDelete: n => `Delete "${n}"? This cannot be undone.`,
      cannotRemove: n => `${n} is part of an expense and can't be removed. Edit or delete the expense first.`,
      duplicate: n => `There is already a participant called ${n}.`,
      needName: 'Enter a name.', needAmount: 'Enter an amount above zero.', needDesc: 'Enter a description.',
      needAmong: 'Pick at least one person.',
      defaultList: 'Our expenses', newListName: n => `New list ${n}`,
      copy: 'Copy', copied: 'Copied!', download: 'Download', restore: 'Restore',
      backupIntro: 'All your lists as text. Save it somewhere, or paste an earlier copy and tap Restore.',
      restoreBad: "That text isn't a valid backup.", restored: n => `${n} lists restored.`,
      shareTitle: 'Share list', shareIntro: 'Send the link. The recipient gets their own copy of the list in their browser.',
      importTitle: 'Import shared list', importQ: n => `Add the list "${n}" to this device?`,
      importBtn: 'Add', imported: 'The list was added.', importBad: "The link couldn't be read.",
      close: 'Close'
    }
  };

  // ---------- state ----------
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  let mem = null;
  function load() {
    try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
    return mem;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem = S; }
  }
  const navLang = (navigator.language || 'en').toLowerCase().startsWith('sv') ? 'sv' : 'en';
  let S = load() || { lists: [], current: null, lang: navLang, theme: 'bold', ui: { people: true, tip: false, settings: false } };
  S.ui = S.ui || { people: true, tip: false, settings: false };
  const t = () => T[S.lang] || T.en;

  function blankList(name) {
    return { id: uid(), name, currency: 'SEK', people: [], expenses: [], tip: { enabled: false, mode: 'percent', value: 10, payer: null } };
  }
  function ensure() {
    if (!S.lists.length) S.lists.push(blankList(t().defaultList));
    if (!S.lists.find(l => l.id === S.current)) S.current = S.lists[0].id;
  }
  const cur = () => S.lists.find(l => l.id === S.current);

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
  const money = (v, list) => {
    try { return new Intl.NumberFormat(S.lang === 'sv' ? 'sv-SE' : 'en-US', { style: 'currency', currency: list.currency, currencyDisplay: 'code' }).format(v); }
    catch (e) { return `${list.currency} ${v.toFixed(2)}`; }
  };
  const pname = (list, id) => (list.people.find(p => p.id === id) || { name: '?' }).name;

  // Per-person share of one expense. `known` limits to existing people.
  function expenseParts(e, known) {
    const mode = (e.split && e.split.mode) || 'equal', out = {};
    const has = id => !known || known[id] !== undefined;
    if (mode === 'equal') {
      const among = e.among.filter(has);
      among.forEach(id => { out[id] = e.amount / among.length; });
      return out;
    }
    const vals = e.split.values || {};
    const ids = Object.keys(vals).filter(id => has(id) && vals[id] > 0);
    if (mode === 'percent') ids.forEach(id => { out[id] = e.amount * vals[id] / 100; });
    else if (mode === 'shares') {
      const tot = ids.reduce((s, id) => s + vals[id], 0);
      ids.forEach(id => { out[id] = tot ? e.amount * vals[id] / tot : 0; });
    } else if (mode === 'exact') ids.forEach(id => { out[id] = vals[id]; });
    return out;
  }

  function calc(list) {
    const paid = {}, owed = {};
    list.people.forEach(p => { paid[p.id] = 0; owed[p.id] = 0; });
    let sum = 0;
    list.expenses.forEach(e => {
      sum += e.amount;
      if (paid[e.payer] !== undefined) paid[e.payer] += e.amount;
      const parts = expenseParts(e, owed);
      Object.keys(parts).forEach(id => { owed[id] += parts[id]; });
    });
    let tip = 0;
    const tp = list.tip;
    if (tp.enabled && list.people.length) {
      tip = tp.mode === 'percent' ? sum * (Number(tp.value) || 0) / 100 : (Number(tp.value) || 0);
      const payer = paid[tp.payer] !== undefined ? tp.payer : list.people[0].id;
      paid[payer] += tip;
      list.people.forEach(p => { owed[p.id] += tip / list.people.length; });
    }
    const bal = {};
    list.people.forEach(p => { bal[p.id] = paid[p.id] - owed[p.id]; });
    // greedy settle
    const cr = [], db = [];
    list.people.forEach(p => {
      const b = Math.round(bal[p.id] * 100) / 100;
      if (b > 0.004) cr.push({ id: p.id, v: b }); else if (b < -0.004) db.push({ id: p.id, v: -b });
    });
    cr.sort((a, b) => b.v - a.v); db.sort((a, b) => b.v - a.v);
    const tx = [];
    let i = 0, j = 0;
    while (i < db.length && j < cr.length) {
      const v = Math.min(db[i].v, cr[j].v);
      if (v > 0.004) tx.push({ from: db[i].id, to: cr[j].id, v });
      db[i].v -= v; cr[j].v -= v;
      if (db[i].v < 0.005) i++;
      if (cr[j].v < 0.005) j++;
    }
    return { sum, tip, total: sum + tip, paid, owed, bal, tx };
  }

  // ---------- render ----------
  const $ = s => document.querySelector(s);
  const app = $('#mellan-app');
  const chevUp = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 15l6-6 6 6"></path></svg>';
  const chevDown = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"></path></svg>';

  function applyTheme() {
    if (!THEMES.includes(S.theme)) S.theme = 'bold';
    app.dataset.theme = S.theme;
    document.querySelectorAll('style[data-theme-css]').forEach(st => { st.disabled = st.dataset.themeCss !== S.theme; });
  }

  function renderStatic() {
    const L = t();
    document.documentElement.lang = S.lang;
    app.lang = S.lang;
    $('.preferences summary').setAttribute('aria-label', L.settings);
    $('.preferences summary').title = L.settings;
    $('.preferences-label').textContent = L.settings;
    $('.preferences-panel strong').textContent = L.settings;
    $('#lbl-language').textContent = L.language;
    $('#lbl-theme').textContent = L.theme;
    $('#language-choice').value = S.lang;
    const dc = $('#design-choice');
    dc.innerHTML = THEMES.map(th => `<option value="${th}"${th === S.theme ? ' selected' : ''}>${esc(L.themeNames[th])}</option>`).join('');
    $('#lbl-mylists').textContent = L.myLists;
    $('[data-action="new"]').setAttribute('aria-label', L.newListAria);
    $('#foot1').textContent = L.noAccount;
    $('#foot2').textContent = L.dataLocal;
  }

  function fold(id, title, body) {
    const open = !!S.ui[id];
    return `<section class="panel fold-panel ${open ? '' : 'is-collapsed'}" id="m-fold-${id}"><div class="ph"><h3>${esc(title)}</h3><button type="button" class="btn tiny quiet people-toggle" data-action="fold-toggle" data-id="${id}" aria-expanded="${open}" aria-controls="m-fold-body-${id}" aria-label="${esc((open ? t().hide : t().show) + ' ' + title)}" title="${esc((open ? t().hide : t().show) + ' ' + title)}">${open ? chevUp : chevDown}</button></div><div class="people-body" id="m-fold-body-${id}" ${open ? '' : 'inert'}><div class="people-inner"><div class="fold-content">${body}</div></div></div></section>`;
  }

  function render() {
    ensure();
    const L = t(), list = cur(), c = calc(list);
    $('#m-nav').innerHTML = S.lists.map(l =>
      `<button data-action="open" data-id="${l.id}" class="${l.id === S.current ? 'on' : ''}"><b>${esc(l.name)}</b><span>${esc(L.participantsN(l.people.length))}</span></button>`).join('');

    const people = list.people.length ? list.people.map(p => {
      const b = c.bal[p.id], r = Math.round(b * 100) / 100;
      const cls = r > 0 ? 'plus' : r < 0 ? 'minus' : '';
      return `<div class="person"><div class="who"><b>${esc(p.name)}</b><small>${esc(L.paid)} ${esc(money(c.paid[p.id], list))} · ${esc(L.shareOf)} ${esc(money(c.owed[p.id], list))}</small></div><span class="balance ${cls}">${r > 0 ? '+' : ''}${esc(money(r, list))}</span><button class="btn tiny quiet" data-action="person-remove" data-id="${p.id}" aria-label="${esc(L.remove + ' ' + p.name)}" title="${esc(L.remove)}">×</button></div>`;
    }).join('') : `<div class="empty">${esc(L.startAdding)}</div>`;

    const expenses = list.expenses.length ? list.expenses.slice().reverse().map(e => {
      const mode = (e.split && e.split.mode) || 'equal';
      let how;
      if (mode === 'equal') {
        how = `${L.splitBetween} ${e.among.length === list.people.length ? L.everyone : e.among.map(id => pname(list, id)).join(', ')}`;
      } else {
        const v = e.split.values, fmt = x => String(Math.round(x * 100) / 100).replace('.', S.lang === 'sv' ? ',' : '.');
        how = `${L.modeShort[mode]}: ` + Object.keys(v).filter(id => v[id] > 0).map(id =>
          `${pname(list, id)} ${mode === 'percent' ? fmt(v[id]) + ' %' : mode === 'exact' ? money(v[id], list) : fmt(v[id])}`).join(', ');
      }
      return `<div class="item"><div class="desc"><b>${esc(e.desc)}</b><span>${esc(L.paidBy)} ${esc(pname(list, e.payer))} · ${esc(how)}</span></div><span class="amount">${esc(money(e.amount, list))}</span><button class="btn tiny" data-action="expense-edit" data-id="${e.id}">${esc(L.edit)}</button></div>`;
    }).join('') : `<div class="empty">${esc(L.noExpenses)}</div>`;

    const settle = c.tx.length ? c.tx.map(x =>
      `<div class="settle"><div><b>${esc(pname(list, x.from))} → ${esc(pname(list, x.to))}</b><div class="detail">${esc(L.pays(pname(list, x.from), pname(list, x.to)))}</div></div><span class="plus">${esc(money(x.v, list))}</span></div>`).join('')
      : `<div class="empty">${esc(L.settled)}</div>`;

    const tp = list.tip, noPeople = !list.people.length;
    const tipBody = `<form id="m-tip" class="tipform"><label class="checkbox"><input type="checkbox" name="enabled" ${tp.enabled ? 'checked' : ''} ${noPeople ? 'disabled' : ''}> ${esc(L.includeTip)}</label><div class="tiprow"><div><label>${esc(L.type)}<select name="mode"><option value="percent" ${tp.mode === 'percent' ? 'selected' : ''}>${esc(L.percent)}</option><option value="fixed" ${tp.mode === 'fixed' ? 'selected' : ''}>${esc(L.fixed)}</option></select></label></div><div><label>${esc(L.value)}<input name="value" inputmode="decimal" value="${esc(tp.value)}"></label></div></div><div><label>${esc(L.whoPaysTip)}<select name="payer">${list.people.map(p => `<option value="${p.id}" ${p.id === tp.payer ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div><div class="actions"><button class="btn tiny primary" type="submit">${esc(L.updateTip)}</button></div><span class="sub">${esc(L.tipIs)}: ${esc(money(c.tip, list))}</span></form>`;

    const settingsBody = `<div class="tiprow"><label>${esc(L.currency)} <select id="m-currency" class="currency">${CURRENCIES.map(cu => `<option ${cu === list.currency ? 'selected' : ''}>${cu}</option>`).join('')}</select></label><button class="btn tiny danger" data-action="delete-list">${esc(L.deleteList)}</button></div><p class="sharedhint">${esc(L.savedHint)}</p>`;

    const pOpen = S.ui.people !== false;
    $('#m-content').innerHTML =
      `${toastMsg ? `<div class="toast" role="status">${esc(toastMsg)}</div>` : ''}<header class="top"><div><h2>${esc(list.name)}</h2></div><div class="actions"><button class="btn" data-action="rename">${esc(L.rename)}</button><button class="btn" data-action="backup">${esc(L.backup)}</button><button class="btn" data-action="share">${esc(L.share)}</button></div></header>
      <div class="grid3"><div class="stat"><span class="label">${esc(L.total)}</span><strong>${esc(money(c.total, list))}</strong>${c.tip > 0 ? `<small>${esc(L.inclTip)} (${esc(money(c.tip, list))})</small>` : `<small>${esc(L.inclTip)}</small>`}</div></div>
      <section class="panel participants-panel ${pOpen ? '' : 'is-collapsed'}" id="m-people"><div class="ph"><h3>${esc(L.participants)} <span class="sub">(${list.people.length})</span></h3><div class="actions"><button class="btn tiny" data-action="person-add">${esc(L.add)}</button><button class="btn tiny quiet people-toggle" data-action="people-toggle" aria-label="${esc(pOpen ? L.collapseP : L.expandP)}" title="${esc(pOpen ? L.collapseP : L.expandP)}" aria-expanded="${pOpen}" aria-controls="m-people-body">${pOpen ? chevUp : chevDown}</button></div></div><p class="people-error" id="m-people-error" role="alert" hidden></p><div id="m-people-body" class="people-body" ${pOpen ? '' : 'inert'}><div class="people-inner"><div class="people-grid">${people}</div></div></div></section>
      <div class="columns"><div><section class="panel"><div class="ph"><h3>${esc(L.expenses)}</h3><button class="btn tiny primary" data-action="expense-add" ${noPeople ? 'disabled' : ''}>${esc(L.newExpense)}</button></div>${expenses}</section><section class="panel"><div class="ph"><h3>${esc(L.settleUp)}</h3></div>${settle}</section></div><div>${fold('tip', L.tip, tipBody)}${fold('settings', L.listSettings, settingsBody)}</div></div>`;
    toastMsg = '';
  }

  let toastMsg = '';
  function update(fn, msg) {
    const go = () => { if (fn) fn(); persist(); if (msg) toastMsg = msg; render(); };
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(go);
    else go();
  }
  function peopleError(msg) {
    const el = $('#m-people-error'); if (!el) return;
    el.textContent = msg; el.hidden = false;
    clearTimeout(peopleError.t); peopleError.t = setTimeout(() => { el.hidden = true; }, 5000);
  }

  // ---------- modals ----------
  const overlay = $('#m-overlay');
  let lastFocus = null;
  function modal(html, onSubmit, onReady) {
    lastFocus = document.activeElement;
    overlay.innerHTML = `<div class="modalbg"><form class="modal" role="dialog" aria-modal="true" novalidate>${html}</form></div>`;
    const form = overlay.querySelector('form');
    form.addEventListener('submit', e => { e.preventDefault(); if (onSubmit) onSubmit(form); });
    overlay.querySelector('.modalbg').addEventListener('click', e => { if (e.target.classList.contains('modalbg')) closeModal(); });
    form.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
    if (onReady) onReady(form);
    const f = form.querySelector('input:not([type=checkbox]), textarea, select, button');
    if (f) f.focus();
  }
  function closeModal() { overlay.innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.innerHTML) closeModal(); });
  const footer = (ok, extra = '') => `<div class="modalfooter">${extra}<button type="button" class="btn" data-close>${esc(t().cancel)}</button><button type="submit" class="btn primary">${esc(ok)}</button></div>`;
  const errEl = '<p class="error" role="alert" data-err></p>';
  const setErr = (form, m) => { form.querySelector('[data-err]').textContent = m; };

  function personModal() {
    const L = t(), list = cur();
    modal(`<h3>${esc(L.addPerson)}</h3><div class="field"><label for="f-name">${esc(L.name)}</label><input id="f-name" name="name" autocomplete="off" maxlength="60"></div>${errEl}${footer(L.add.replace('＋ ', ''))}`, form => {
      const name = form.name.value.trim();
      if (!name) return setErr(form, L.needName);
      if (list.people.some(p => p.name.toLowerCase() === name.toLowerCase())) return setErr(form, L.duplicate(name));
      closeModal();
      update(() => {
        const p = { id: uid(), name };
        list.people.push(p);
        list.expenses.forEach(e => { if (e.allPeople) e.among.push(p.id); });
        if (!list.tip.payer) list.tip.payer = p.id;
      });
      setTimeout(() => { const b = $('[data-action="person-add"]'); if (b) b.focus(); }, 0);
    });
  }

  const fmtNum = x => String(Math.round(x * 100) / 100).replace('.', S.lang === 'sv' ? ',' : '.');

  function expenseModal(exp) {
    const L = t(), list = cur();
    const e = exp || { desc: '', amount: '', payer: list.people[0].id, among: list.people.map(p => p.id) };
    const st = { mode: (e.split && e.split.mode) || 'equal', vals: Object.assign({}, e.split && e.split.values) };
    const amt = form => num(form.amount.value);

    function defaults(mode, form) {
      const ids = list.people.map(p => p.id), n = ids.length, v = {};
      if (mode === 'percent') { let left = 100; ids.forEach((id, i) => { const x = i === n - 1 ? left : Math.round(10000 / n) / 100; v[id] = x; left = Math.round((left - x) * 100) / 100; }); }
      else if (mode === 'shares') ids.forEach(id => { v[id] = 1; });
      else if (mode === 'exact') {
        const a = amt(form);
        if (a > 0) { let left = Math.round(a * 100); ids.forEach((id, i) => { const x = i === n - 1 ? left : Math.round(a * 100 / n); v[id] = x / 100; left -= x; }); }
      }
      return v;
    }

    function readVals(form) {
      const v = {}; let bad = false;
      form.querySelectorAll('[data-pid]').forEach(i => {
        const raw = i.value.trim(); if (raw === '') return;
        const x = num(raw); if (!(x >= 0)) bad = true; else v[i.dataset.pid] = x;
      });
      return bad ? null : v;
    }

    function renderSplit(form) {
      const box = form.querySelector('[data-split]');
      if (st.mode === 'equal') {
        const checked = e.split && e.split.mode !== 'equal' ? list.people.map(p => p.id) : e.among;
        box.innerHTML = `<div class="checkgrid">${list.people.map(p => `<label><input type="checkbox" name="among" value="${p.id}" ${checked.includes(p.id) ? 'checked' : ''}> ${esc(p.name)}</label>`).join('')}</div>`;
        return;
      }
      const unit = st.mode === 'percent' ? '%' : st.mode === 'exact' ? list.currency : '';
      box.innerHTML = `<p class="notice splithint">${esc(L.modeHint[st.mode])}</p><div class="splitrows">${list.people.map(p =>
        `<label class="splitrow"><span class="nm"><b>${esc(p.name)}</b><small data-out="${p.id}"></small></span><span class="splitin"><input data-pid="${p.id}" inputmode="decimal" autocomplete="off" value="${st.vals[p.id] !== undefined ? esc(fmtNum(st.vals[p.id])) : ''}" placeholder="0" aria-label="${esc(p.name)}">${unit ? `<span>${esc(unit)}</span>` : ''}</span></label>`).join('')}</div><p class="splitsum" data-sum aria-live="polite"></p>`;
      summary(form);
    }

    function summary(form) {
      if (st.mode === 'equal') return;
      const v = readVals(form) || {}, a = amt(form) > 0 ? amt(form) : 0;
      const parts = expenseParts({ amount: a, among: [], split: { mode: st.mode, values: v } });
      list.people.forEach(p => { const o = form.querySelector(`[data-out="${p.id}"]`); if (o) o.textContent = a && parts[p.id] ? money(parts[p.id], list) : ''; });
      const sumEl = form.querySelector('[data-sum]');
      const tot = Object.values(v).reduce((s, x) => s + x, 0);
      let txt, ok;
      if (st.mode === 'percent') { const r = 100 - tot; ok = Math.abs(r) < 0.005; txt = r < -0.004 ? L.sumPercentOver(fmtNum(tot), fmtNum(-r)) : L.sumPercent(fmtNum(tot), fmtNum(Math.max(r, 0))); }
      else if (st.mode === 'shares') { ok = tot > 0; txt = L.sumShares(fmtNum(tot)); }
      else { const r = a - tot; ok = Math.abs(r) < 0.005; txt = r < -0.004 ? L.sumExactOver(money(tot, list), money(-r, list)) : L.sumExact(money(tot, list), money(Math.max(r, 0), list)); }
      sumEl.textContent = txt;
      sumEl.classList.toggle('is-ok', ok);
    }

    modal(`<h3>${esc(exp ? L.editExpense : L.newExpenseTitle)}</h3>
      <div class="field"><label for="f-desc">${esc(L.description)}</label><input id="f-desc" name="desc" value="${esc(e.desc)}" maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="f-amount">${esc(L.amount)} (${esc(list.currency)})</label><input id="f-amount" name="amount" inputmode="decimal" value="${e.amount === '' ? '' : esc(String(e.amount).replace('.', S.lang === 'sv' ? ',' : '.'))}" autocomplete="off"></div>
      <div class="field"><label for="f-payer">${esc(L.whoPaid)}</label><select id="f-payer" name="payer">${list.people.map(p => `<option value="${p.id}" ${p.id === e.payer ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-mode">${esc(L.howSplit)}</label><select id="f-mode" name="mode">${Object.keys(L.modes).map(m => `<option value="${m}" ${m === st.mode ? 'selected' : ''}>${esc(L.modes[m])}</option>`).join('')}</select><div data-split></div></div>
      ${errEl}${footer(exp ? L.save : L.create, exp ? `<button type="button" class="btn danger" data-del>${esc(L.del)}</button>` : '')}`,
      form => {
        const desc = form.desc.value.trim(), amount = Math.round(num(form.amount.value) * 100) / 100;
        if (!desc) return setErr(form, L.needDesc);
        if (!(amount > 0)) return setErr(form, L.needAmount);
        let among, split;
        if (st.mode === 'equal') {
          among = [...form.querySelectorAll('[name=among]:checked')].map(i => i.value);
          if (!among.length) return setErr(form, L.needAmong);
          split = { mode: 'equal' };
        } else {
          const v = readVals(form);
          if (!v) return setErr(form, L.badNumber);
          Object.keys(v).forEach(id => { if (!(v[id] > 0)) delete v[id]; });
          const tot = Object.values(v).reduce((s, x) => s + x, 0);
          if (st.mode === 'percent' && Math.abs(tot - 100) >= 0.005) return setErr(form, L.needPercent);
          if (st.mode === 'shares' && !(tot > 0)) return setErr(form, L.needShares);
          if (st.mode === 'exact' && Math.abs(tot - amount) >= 0.005) return setErr(form, L.needExact);
          among = Object.keys(v);
          split = { mode: st.mode, values: v };
        }
        closeModal();
        update(() => {
          const data = { desc, amount, payer: form.payer.value, among, split, allPeople: split.mode === 'equal' && among.length === list.people.length };
          if (exp) Object.assign(exp, data); else list.expenses.push({ id: uid(), date: Date.now(), ...data });
        });
      },
      form => {
        renderSplit(form);
        form.mode.addEventListener('change', () => {
          const v = readVals(form);
          if (st.mode !== 'equal' && v) st.vals = v;
          st.mode = form.mode.value;
          const same = e.split && e.split.mode === st.mode;
          st.vals = same ? Object.assign({}, e.split.values) : defaults(st.mode, form);
          setErr(form, '');
          renderSplit(form);
        });
        form.addEventListener('input', ev => {
          if (ev.target.dataset.pid !== undefined || ev.target.name === 'amount') summary(form);
        });
        const d = form.querySelector('[data-del]');
        if (d) d.addEventListener('click', () => { closeModal(); update(() => { list.expenses = list.expenses.filter(x => x.id !== exp.id); }); });
      });
  }

  function renameModal() {
    const L = t(), list = cur();
    modal(`<h3>${esc(L.renameTitle)}</h3><div class="field"><label for="f-lname">${esc(L.listName)}</label><input id="f-lname" name="lname" value="${esc(list.name)}" maxlength="60"></div>${errEl}${footer(L.save)}`, form => {
      const n = form.lname.value.trim();
      if (!n) return setErr(form, L.needName);
      closeModal(); update(() => { list.name = n; });
    }, form => form.lname.select());
  }

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
    if (btn) { const o = btn.textContent; btn.textContent = t().copied; setTimeout(() => { btn.textContent = o; }, 1500); }
  }

  function backupModal() {
    const L = t();
    const json = JSON.stringify({ app: 'split', version: 1, lists: S.lists }, null, 2);
    modal(`<h3>${esc(L.backup)}</h3><p class="notice">${esc(L.backupIntro)}</p><textarea name="data" spellcheck="false" aria-label="${esc(L.backup)}">${esc(json)}</textarea>${errEl}
      <div class="modalfooter"><button type="button" class="btn" data-copy>${esc(L.copy)}</button><button type="button" class="btn" data-dl>${esc(L.download)}</button><button type="button" class="btn" data-close>${esc(L.close)}</button><button type="submit" class="btn primary">${esc(L.restore)}</button></div>`,
      form => {
        let data;
        try { data = JSON.parse(form.data.value); } catch (e) { return setErr(form, L.restoreBad); }
        const lists = Array.isArray(data) ? data : data && data.lists;
        if (!Array.isArray(lists) || !lists.every(validList)) return setErr(form, L.restoreBad);
        closeModal();
        update(() => {
          lists.forEach(l => { const i = S.lists.findIndex(x => x.id === l.id); if (i >= 0) S.lists[i] = l; else S.lists.push(l); });
          S.current = lists[0] ? lists[0].id : S.current;
        }, L.restored(lists.length));
      },
      form => {
        form.querySelector('[data-copy]').addEventListener('click', e => copyText(form.data.value, e.currentTarget));
        form.querySelector('[data-dl]').addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([form.data.value], { type: 'application/json' }));
          a.download = `split-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        });
      });
  }

  function validList(l) {
    return l && typeof l.name === 'string' && Array.isArray(l.people) && Array.isArray(l.expenses)
      && l.people.every(p => p && typeof p.id === 'string' && typeof p.name === 'string')
      && l.expenses.every(e => e && typeof e.amount === 'number' && Array.isArray(e.among))
      && (l.id = l.id || uid()) && (l.currency = CURRENCIES.includes(l.currency) ? l.currency : 'SEK')
      && (l.tip = l.tip || { enabled: false, mode: 'percent', value: 10, payer: null });
  }

  // base64url for UTF-8
  const enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));

  async function share() {
    const L = t(), list = cur();
    const url = `${location.origin}${location.pathname}#import=${enc(JSON.stringify(list))}`;
    if (navigator.share) {
      try { await navigator.share({ title: list.name, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    modal(`<h3>${esc(L.shareTitle)}</h3><p class="notice">${esc(L.shareIntro)}</p><textarea name="link" readonly spellcheck="false">${esc(url)}</textarea>
      <div class="modalfooter"><button type="button" class="btn" data-close>${esc(L.close)}</button><button type="submit" class="btn primary">${esc(L.copy)}</button></div>`,
      form => copyText(url, form.querySelector('[type=submit]')));
  }

  function checkImport() {
    const m = location.hash.match(/^#import=([\w-]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    const L = t();
    let list;
    try { list = JSON.parse(dec(m[1])); if (!validList(list)) throw 0; } catch (e) { toastMsg = L.importBad; render(); return; }
    modal(`<h3>${esc(L.importTitle)}</h3><p class="notice">${esc(L.importQ(list.name))}</p>${footer(L.importBtn)}`, () => {
      closeModal();
      update(() => {
        const existing = S.lists.findIndex(x => x.id === list.id);
        if (existing >= 0) S.lists[existing] = list; else S.lists.push(list);
        S.current = list.id;
      }, L.imported);
    });
  }

  function deleteModal() {
    const L = t(), list = cur();
    modal(`<h3>${esc(L.deleteList)}</h3><p class="notice">${esc(L.confirmDelete(list.name))}</p>${footer(L.del)}`, () => {
      closeModal();
      update(() => { S.lists = S.lists.filter(l => l.id !== list.id); S.current = S.lists[0] ? S.lists[0].id : null; });
    }, form => { form.querySelector('[type=submit]').classList.replace('primary', 'danger'); });
  }

  // ---------- events ----------
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b || overlay.contains(b)) return;
    const a = b.dataset.action, list = cur();
    switch (a) {
      case 'new': update(() => { const l = blankList(t().newListName(S.lists.length + 1)); S.lists.push(l); S.current = l.id; }); setTimeout(renameModal, 0); break;
      case 'open': update(() => { S.current = b.dataset.id; }); break;
      case 'rename': renameModal(); break;
      case 'backup': backupModal(); break;
      case 'share': share(); break;
      case 'person-add': personModal(); break;
      case 'person-remove': {
        const id = b.dataset.id, p = list.people.find(x => x.id === id);
        if (list.expenses.some(x => x.payer === id || (x.among.includes(id) && !x.allPeople) || (x.allPeople && x.among.length === 1 && x.among[0] === id))) return peopleError(t().cannotRemove(p.name));
        update(() => {
          list.people = list.people.filter(x => x.id !== id);
          list.expenses.forEach(x => { x.among = x.among.filter(y => y !== id); });
          if (list.tip.payer === id) list.tip.payer = list.people[0] ? list.people[0].id : null;
        });
        break;
      }
      case 'people-toggle': update(() => { S.ui.people = S.ui.people === false; }); break;
      case 'fold-toggle': update(() => { S.ui[b.dataset.id] = !S.ui[b.dataset.id]; }); break;
      case 'expense-add': if (list.people.length) expenseModal(); break;
      case 'expense-edit': expenseModal(list.expenses.find(x => x.id === b.dataset.id)); break;
      case 'delete-list': deleteModal(); break;
    }
  });

  app.addEventListener('submit', e => {
    if (e.target.id !== 'm-tip') return;
    e.preventDefault();
    const f = e.target, list = cur(), v = num(f.value.value);
    update(() => {
      list.tip = { enabled: f.enabled.checked, mode: f.mode.value, value: isFinite(v) && v >= 0 ? v : 0, payer: f.payer.value || null };
    });
  });
  app.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'm-currency') update(() => { cur().currency = el.value; });
    else if (el.id === 'language-choice') { S.lang = el.value; persist(); renderStatic(); render(); }
    else if (el.id === 'design-choice') { S.theme = el.value; persist(); applyTheme(); }
    else if (el.name === 'enabled' && el.closest('#m-tip')) el.form.requestSubmit();
  });

  // ---------- boot ----------
  ensure(); persist(); applyTheme(); renderStatic(); render(); checkImport();
  window.addEventListener('hashchange', checkImport);
  app.dataset.ready = '1';
})();

</script>
</body>
</html>
